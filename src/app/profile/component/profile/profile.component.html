<div class="flex h-screen">
  <!-- Form Section -->
  <div [ngClass]="hasContent ? 'w-3/10' : 'w-1/2'" class="transition-all duration-300 p-4">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-6 bg-white p-6 rounded shadow-md">

      <h2 class="text-lg font-semibold text-gray-700">Profile Details</h2>

      <!-- First & Last Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input type="text" formControlName="name"
          class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100"
          [readonly]="userForm.disabled">
      </div>


      <!-- Age -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contact</label>
        <input type="number" formControlName="contact"
          class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100"
          [readonly]="userForm.disabled">
      </div>

      <!-- Address -->
      <div formGroupName="address" class="space-y-4">
        <h3 class="text-md font-semibold text-gray-600">Address</h3>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Street</label>
          <input type="text" formControlName="street"
            class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100"
            [readonly]="userForm.disabled">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input type="text" formControlName="city"
            class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100"
            [readonly]="userForm.disabled">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
            <input type="text" formControlName="state"
              class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100"
              [readonly]="userForm.disabled">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ZIP</label>
            <input type="text" formControlName="zip"
              class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100"
              [readonly]="userForm.disabled">
          </div>
        </div>
      </div>

      <!-- [disabled]="userForm.disabled" -->

      <button type="submit"
        class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition disabled:opacity-50">
        Update Profile
      </button>
    </form>
  </div>

  <!-- Router Outlet -->
  <div [ngClass]="hasContent ? 'w-7/10' : 'w-1/2'" class="transition-all duration-300 bg-gray-50 p-4">
    <router-outlet (activate)="onActivate()" (deactivate)="onDeactivate()"></router-outlet>
  </div>
</div>
