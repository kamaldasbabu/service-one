    <!-- Form Section -->
    <!-- <div [ngClass]="hasContent ? 'w-3/10' : 'w-1/2'" class="transition-all duration-300 p-4"> -->
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="space-y-6 bg-red rounded shadow-md">

        <h2 class="text-lg font-semibold text-gray-700">Task Details</h2>

        <!-- First & Last Name -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Id : </label>
            <input type="text" formControlName="id"
                class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100">
        </div>


        <!-- Age -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description : </label>
            <input type="text" formControlName="description"
                class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Difficulty Level : </label>
            <input type="text" formControlName="difficultyLevel"
                class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-100">
        </div>


        <!-- [disabled]="userForm.disabled" -->

        <button type="submit"
            class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition disabled:opacity-50">
            Update Task
        </button>
    </form>
