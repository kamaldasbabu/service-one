<aside class="w-50 min-w-50 max-w-60 bg-cyan-600 text-white h-full overflow-hidden">
  <nav class="flex flex-col space-y-2 p-4">
    <a *ngIf="navigationAccess?.dashboard"
      routerLink="/dashboard"
      routerLinkActive="bg-cyan-700 text-white font-semibold"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-4 py-2 rounded-lg hover:bg-cyan-500 transition-all duration-200 whitespace-nowrap"
    >
      Dashboard
    </a>
    <a
    *ngIf="navigationAccess?.profile"
      routerLink="/profile"
      routerLinkActive="bg-cyan-700 text-white font-semibold"
      class="px-4 py-2 rounded-lg hover:bg-cyan-500 transition-all duration-200 whitespace-nowrap"
    >
      Profile
    </a>
    <a 
    *ngIf="navigationAccess?.services"
      routerLink="/services"
      routerLinkActive="bg-cyan-700 text-white font-semibold"
      class="px-4 py-2 rounded-lg hover:bg-cyan-500 transition-all duration-200 whitespace-nowrap"
    >
      Services
    </a>
    <a
    *ngIf="navigationAccess?.signIn"
      routerLink="/sign-in"
      routerLinkActive="bg-cyan-700 text-white font-semibold"
      class="px-4 py-2 rounded-lg hover:bg-cyan-500 transition-all duration-200 whitespace-nowrap"
    >
      Sing In
    </a>
    <a
    *ngIf="navigationAccess?.signUp"
      routerLink="/sign-up"
      routerLinkActive="bg-cyan-700 text-white font-semibold"
      class="px-4 py-2 rounded-lg hover:bg-cyan-500 transition-all duration-200 whitespace-nowrap"
    >
      Sing Up
    </a>
    <a
    *ngIf="navigationAccess?.subscription"
      routerLink="/subscription"
      routerLinkActive="bg-cyan-700 text-white font-semibold"
      class="px-4 py-2 rounded-lg hover:bg-cyan-500 transition-all duration-200 whitespace-nowrap"
    >
      Subscription
    </a>
    <a
      routerLink="/task"
      routerLinkActive="bg-cyan-700 text-white font-semibold"
      class="px-4 py-2 rounded-lg hover:bg-cyan-500 transition-all duration-200 whitespace-nowrap"
    >
      Task
    </a>
  </nav>
</aside>
