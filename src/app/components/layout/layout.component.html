<div class="flex flex-col h-screen">
  <!-- Header (fixed) -->
  <app-header class="flex-none bg-cyan-100"></app-header>

  <!-- Body (fills remaining space) -->
  <div class="flex flex-1 min-h-0">
    <!-- Sidebar (scrollable vertically) -->
    <app-sidebar class="bg-cyan-100 p-2 hidden md:block flex-none overflow-y-auto"></app-sidebar>

    <!-- Main Content (scrollable both directions) -->
    <main class="flex-1 overflow-auto p-2 bg-white">
      <app-loader></app-loader>
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Footer (fixed) -->
  <app-footer class="flex-none bg-cyan-100"></app-footer>
</div>
